apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-balance-test
  labels:
    app: multi-host
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multi-host
  template:
    metadata:
      labels:
        app: multi-host
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        # Sobrescribimos el comando para escribir el nombre del Pod en index.html
        command: ["/bin/sh", "-c"]
        args:
        - >
          echo "Hola desde el host: $HOSTNAME" > /usr/share/nginx/html/index.html &&
          nginx -g "daemon off;"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-balance-svc
spec:
  selector:
    app: multi-host
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP