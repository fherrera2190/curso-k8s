#Se puede ver en kubectl api-resources que el apiVersion apps/v1 es la version estable de Deployment, y que se encuentra en el grupo apps.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-test
  labels:
    app: front
spec:
  replicas: 3
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
